name: D iPad acceptance
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Apple silicon simulator runner
        type: choice
        options: [macos-26, macos-15]
        default: macos-26
      build_run:
        description: Successful D iOS simulator run ID
        required: true
      local_chat:
        description: Download the small onboarding model and verify a reply and saved history
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 35
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 360000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: D-iOS-simulator
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: binary
      - name: Install test driver
        run: brew install mobile-dev-inc/tap/maestro
      - name: Exercise a fresh install on iPad
        run: |
          device=$(xcrun simctl list -j devices available | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPad")))')
          echo "IPAD_UDID=$device" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$device" -b
          ditto -x -k binary/D-simulator.zip binary
          xcrun simctl install "$device" binary/PocketPal.app
          mkdir screenshots
          cd screenshots
          maestro --device "$device" test --format junit --test-output-dir . --output ipad.xml ../e2e/maestro/ipad-first-run.yaml
          xcrun simctl io "$device" screenshot D-iPad-library.png
      - name: Download the model through onboarding
        id: onboarding
        if: inputs.local_chat
        working-directory: screenshots
        run: |
          maestro --device "$IPAD_UDID" test --format junit --test-output-dir . --output download.xml ../e2e/maestro/ipad-download.yaml
          container=$(xcrun simctl get_app_container "$IPAD_UDID" com.linvisxie.d data)
          filename=gemma-3-1b-it-Q4_K_M.gguf
          for attempt in {1..80}; do
            model=$(find "$container/Documents" -name "$filename" -size 806058240c -print -quit)
            if [ -n "$model" ]; then break; fi
            if (( attempt % 6 == 0 )); then
              if maestro --device "$IPAD_UDID" hierarchy | grep -q 'download-banner-retry'; then break; fi
            fi
            sleep 4
          done
          if [ -z "$model" ]; then echo "::error::The onboarding model did not finish downloading."; exit 1; fi
          echo "8d78d9d059a7605c401c105e169e0b08e9f0edc603ceb842f1c4bbb834296d17  $model" | shasum -a 256 -c -
      - name: Inspect a failed simulator model transfer
        if: failure() && steps.onboarding.outcome == 'failure'
        working-directory: screenshots
        run: |
          xcrun simctl io "$IPAD_UDID" screenshot D-iPad-download-failure.png
          df -h .
          xcrun simctl spawn "$IPAD_UDID" log show --last 7m --style compact --predicate 'process == "PocketPal" OR process == "nsurlsessiond"' | grep -Ei 'fail|NSURLError|HTTP [45][0-9][0-9]|disk space' | sed -E 's@https?://[^[:space:]]+@[URL]@g' | tail -45 || true
      - name: Exercise local inference and restored history
        if: ${{ !cancelled() && inputs.local_chat && (steps.onboarding.outcome == 'success' || steps.onboarding.outcome == 'failure') }}
        working-directory: screenshots
        env:
          DOWNLOAD_RESULT: ${{ steps.onboarding.outcome }}
        run: |
          container=$(xcrun simctl get_app_container "$IPAD_UDID" com.linvisxie.d data)
          if [ "$DOWNLOAD_RESULT" = failure ]; then
            # Keep the onboarding failure visible while testing inference independently.
            xcrun simctl terminate "$IPAD_UDID" com.linvisxie.d || true
            repo=lmstudio-community/gemma-3-1b-it-GGUF
            filename=gemma-3-1b-it-Q4_K_M.gguf
            destination="$container/Documents/models/hf/$repo"
            mkdir -p "$destination"
            curl --fail --location --retry 2 --max-time 360 "https://huggingface.co/$repo/resolve/main/$filename?download=true" --output "$RUNNER_TEMP/test-model.gguf"
            echo "8d78d9d059a7605c401c105e169e0b08e9f0edc603ceb842f1c4bbb834296d17  $RUNNER_TEMP/test-model.gguf" | shasum -a 256 -c -
            mv "$RUNNER_TEMP/test-model.gguf" "$destination/$filename"
            xcrun simctl launch "$IPAD_UDID" com.linvisxie.d
          fi
          maestro --device "$IPAD_UDID" test --format junit --test-output-dir . --output inference.xml ../e2e/maestro/ipad-local-chat.yaml
          xcrun simctl io "$IPAD_UDID" screenshot D-iPad-conversation.png
          python3 ../e2e/maestro/check-ipad-reply.py "$container" > local-reply.json
          cat local-reply.json
      - name: Record test failure
        if: failure()
        run: |
          mkdir -p screenshots
          if [ -n "$IPAD_UDID" ]; then xcrun simctl io "$IPAD_UDID" screenshot screenshots/D-iPad-failure.png || true; fi
          find screenshots -name '*.xml' -exec python3 -c 'import sys,xml.etree.ElementTree as E; print("\n".join("::error::"+(f.attrib.get("message") or f.text or "assertion failed")[:500] for f in E.parse(sys.argv[1]).iter("failure")))' {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D-iPad-acceptance
          path: screenshots
