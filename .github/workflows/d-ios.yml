name: D iOS simulator
on:
  workflow_dispatch:
    inputs:
      device_archive:
        description: Build an unsigned archive for physical iPhone and iPad devices
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: corepack enable && yarn install --frozen-lockfile
      - name: Select latest stable Xcode
        run: |
          selected=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          if [ -n "$selected" ]; then sudo xcode-select -s "$selected/Contents/Developer"; fi
          xcodebuild -version
      - run: xcrun -sdk iphonesimulator metal -v || xcodebuild -downloadComponent MetalToolchain
      - run: pod install --project-directory=ios
      - name: Archive for physical devices
        if: inputs.device_archive
        run: |
          set -o pipefail
          xcodebuild -workspace ios/PocketPal.xcworkspace -scheme PocketPal \
            -configuration Release -destination 'generic/platform=iOS' \
            -sdk iphoneos -resultBundlePath /tmp/d-build.xcresult -archivePath build/D.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive 2>&1 | tee /tmp/d-ios-build.log
          app=build/D.xcarchive/Products/Applications/PocketPal.app
          test -s "$app/main.jsbundle"
          lipo "$app/PocketPal" -verify_arch arm64
          mkdir -p build/sideload/Payload
          ditto "$app" build/sideload/Payload/PocketPal.app
          (cd build/sideload && /usr/bin/zip -qry -y ../../D-iPad-unsigned.ipa Payload)
          unzip -tq D-iPad-unsigned.ipa
          ditto -c -k --keepParent build/D.xcarchive D-device-archive.zip
      - uses: actions/upload-artifact@v4
        if: inputs.device_archive
        with:
          name: D-device-archive
          path: |
            D-device-archive.zip
            D-iPad-unsigned.ipa
      - name: Build bundled app
        if: ${{ !inputs.device_archive }}
        run: |
          set -o pipefail
          xcodebuild -workspace ios/PocketPal.xcworkspace -scheme PocketPal \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator -resultBundlePath /tmp/d-build.xcresult -derivedDataPath build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/d-ios-build.log
      - name: Publish compiler errors
        if: failure()
        run: |
          if [ -d /tmp/d-build.xcresult ]; then
            xcrun xcresulttool get build-results --path /tmp/d-build.xcresult | python3 -c 'import json,sys; print("\n".join("::error::"+e.get("message", "")[:1000] for e in json.load(sys.stdin).get("errors", [])[:12]))'
          fi
          if [ -f /tmp/d-ios-build.log ]; then
            awk 'tolower($0) ~ /error:|fatal error|undefined symbol|command .*failed|unable to resolve|module not found/ && tolower($0) !~ /warning:| -werror/ {print "::error::" substr($0,1,800); if (++count == 10) exit}' /tmp/d-ios-build.log
          fi
      - name: Launch on iPad simulator
        if: ${{ !inputs.device_archive }}
        run: |
          device=$(xcrun simctl list -j devices available | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPad")))')
          xcrun simctl bootstatus "$device" -b
          app=build/Build/Products/Release-iphonesimulator/PocketPal.app
          codesign --force --deep --sign - "$app"
          xcrun simctl install "$device" "$app"
          pid=$(xcrun simctl launch "$device" com.linvisxie.d | awk '{print $NF}')
          sleep 12
          kill -0 "$pid"
          xcrun simctl io "$device" screenshot D-first-launch.png
      - name: Package simulator app
        if: ${{ !inputs.device_archive }}
        run: ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/PocketPal.app D-simulator.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.device_archive }}
        with:
          name: D-iOS-simulator
          path: |
            D-simulator.zip
            D-first-launch.png
