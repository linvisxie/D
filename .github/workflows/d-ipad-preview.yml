name: Verify D iPad preview
on:
  workflow_dispatch:
    inputs:
      attach:
        description: Attach the verified IPA to the existing GitHub release
        type: boolean
        default: false
      archive_run:
        description: Successful D iOS device build containing the IPA
        required: true
      tag:
        description: Existing iPad preview tag for the build
        required: true
permissions:
  actions: read
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Identify build revision
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.archive_run }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$RUN" =~ ^[0-9]+$ && "$TAG" =~ ^ipad-preview-[A-Za-z0-9.-]+$ ]]
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq 'select(.conclusion=="success" and .path==".github/workflows/d-ios.yml") | .head_sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          [[ "$sha" = "$tagged" ]]
      - uses: actions/download-artifact@v4
        with:
          name: D-device-archive
          run-id: ${{ inputs.archive_run }}
          github-token: ${{ github.token }}
          path: archive
      - name: Verify the device IPA
        run: |
          cd archive
          unzip -tq D-iPad-unsigned.ipa
          unzip -p D-iPad-unsigned.ipa Payload/PocketPal.app/Info.plist | python3 -c 'import plistlib,sys; info=plistlib.loads(sys.stdin.buffer.read()); assert info["CFBundleSupportedPlatforms"] == ["iPhoneOS"] and 2 in info["UIDeviceFamily"] and info["CFBundleIdentifier"] == "com.linvisxie.d"'
          sha256sum D-iPad-unsigned.ipa | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: D-iPad-unsigned-${{ inputs.tag }}
          path: archive/D-iPad-unsigned.ipa
  attach:
    if: inputs.attach
    needs: package
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: D-iPad-unsigned-${{ inputs.tag }}
      - name: Upload and read back the release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          file=D-iPad-unsigned.ipa
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if ! grep -Fxq "$file" <<< "$assets"; then
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$file" --dir readback
          cmp "$file" "readback/$file"
          sha256sum "readback/$file" >> "$GITHUB_STEP_SUMMARY"
