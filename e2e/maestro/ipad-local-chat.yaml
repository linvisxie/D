appId: com.linvisxie.d
---
- tapOn:
    id: "home-featured-chat"
- extendedWaitUntil:
    visible:
      id: "suggested-prompt-chip-0"
    timeout: 120000
- tapOn:
    id: "suggested-prompt-chip-0"
- extendedWaitUntil:
    visible:
      id: "footer-timing"
    timeout: 300000
- assertNotVisible:
    id: "footer-interrupted-status"
- takeScreenshot: D-iPad-local-reply
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-featured-chat"
    timeout: 90000
- tapOn:
    id: "home-featured-chat"
- extendedWaitUntil:
    visible:
      id: "footer-timing"
    timeout: 120000
- takeScreenshot: D-iPad-restored-chat
