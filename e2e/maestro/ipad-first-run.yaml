appId: com.linvisxie.d
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "onboarding-primary"
    timeout: 60000
- takeScreenshot: D-iPad-welcome
- tapOn:
    id: "onboarding-primary"
- assertVisible: ".*莉娅.*"
- takeScreenshot: D-iPad-models
- tapOn: "稍后下载，先浏览角色"
- extendedWaitUntil:
    visible:
      id: "home-featured-chat"
    timeout: 30000
- assertVisible:
    id: "home-import"
- assertVisible:
    id: "home-create"
- takeScreenshot: D-iPad-characters
- tapOn:
    id: "home-search"
- assertVisible:
    id: "search-input"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-featured-chat"
    timeout: 30000
